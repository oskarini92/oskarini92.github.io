<main>
<section id="lomakkeet">
    <form action="#" method="post" class="kaksi-palstaa">
      <fieldset class="koko-rivi">
        <legend>Tekstikentät (kirjoita ja siirry pois: validointi näkyy)</legend>
        <label for="nimi" class="pakollinen">Teksti</label>
        <input id="nimi" name="nimi" type="text" required placeholder="Pakollinen kenttä">
        <label for="osoite" class="pakollinen">Osoite</label>
        <input id="osoite" name="osoite" type="text" required placeholder="Pakollinen kenttä">
        <label for="email" class="pakollinen">Sähköposti</label>
        <input id="email" name="email" type="email" required placeholder="nimi@example.fi">
      
       
      </fieldset>

</section>

   
</main>
